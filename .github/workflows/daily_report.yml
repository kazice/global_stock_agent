name: 全球龙头行情日报

on:
  schedule:
    - cron: '30 0 * * 1-5'
  workflow_dispatch:
    inputs:
      push_only:
        description: '只推送不采集（使用已有缓存）'
        type: boolean
        default: false
  repository_dispatch:
    types: [push_report]

# ⚡ 提前适配 Node.js 24
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  report:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖 (含 akshare)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 创建缓存目录
        run: mkdir -p cache

      - name: 恢复缓存
        uses: actions/cache/restore@v4
        with:
          path: cache/
          key: stock-cache-${{ github.run_id }}
          restore-keys: stock-cache-

      - name: 拉取最新代码
        run: git fetch origin main && git reset --hard origin/main

      - name: 判断工作日
        id: weekday
        run: |
          DAY=$(date -u +%u)
          if [ "$DAY" -le 5 ]; then
            echo "skip=false" >> $GITHUB_OUTPUT
          else
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "[跳过] 非工作日 (周$DAY)，不执行采集与推送"
          fi

      - name: 运行行情采集与推送
        if: steps.weekday.outputs.skip != 'true'
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          STOOQ_API_KEY: ${{ secrets.STOOQ_API_KEY }}
          REQUEST_INTERVAL: ${{ vars.REQUEST_INTERVAL || '0.35' }}
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ] && [ "${{ github.event.client_payload.push_only }}" = "true" ]; then
            python main.py --push-only
          elif [ "${{ github.event.inputs.push_only }}" = "true" ]; then
            python main.py --push-only
          else
            FORCE_REFRESH=1 python main.py
          fi

      - name: 保存当天缓存
        uses: actions/cache/save@v4
        if: always()
        with:
          path: cache/
          key: stock-cache-${{ github.run_id }}

      - name: 上传报告
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: daily-report
          path: |
            report.md
            report.html
            cache/*.json
