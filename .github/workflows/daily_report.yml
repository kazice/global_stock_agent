name: 全球龙头行情日报

on:
  push:
    branches: [main]
    paths-ignore:
      - 'cache/**'
      - 'report.md'
      - 'report.html'
  schedule:
    - cron: '30 0 * * 1-5'
    - cron: '0 5 * * 1-5'
  workflow_dispatch:
    inputs:
      push_only:
        description: '只推送不采集（使用已有缓存）'
        type: boolean
        default: false
  repository_dispatch:
    types: [push_report]

# ⚡ 提前适配 Node.js 24
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  report:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖 (含 akshare)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 创建缓存目录
        run: mkdir -p cache

      - name: 恢复缓存
        uses: actions/cache/restore@v4
        with:
          path: cache/
          key: stock-cache-${{ github.run_id }}
          restore-keys: stock-cache-

      - name: 运行行情采集与推送
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          JQUANTS_MAIL: ${{ secrets.JQUANTS_MAIL }}
          JQUANTS_PASS: ${{ secrets.JQUANTS_PASS }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          STOOQ_API_KEY: ${{ secrets.STOOQ_API_KEY }}
          REQUEST_INTERVAL: ${{ vars.REQUEST_INTERVAL || '0.35' }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && [ "${{ github.event.schedule }}" = "0 5 * * 1-5" ]; then
            python main.py --push-only
          elif [ "${{ github.event_name }}" = "repository_dispatch" ] && [ "${{ github.event.client_payload.push_only }}" = "true" ]; then
            python main.py --push-only
          elif [ "${{ github.event.inputs.push_only }}" = "true" ]; then
            python main.py --push-only
          else
            FORCE_REFRESH=1 python main.py
          fi

      - name: 保存当天缓存
        uses: actions/cache/save@v4
        if: always()
        with:
          path: cache/
          key: stock-cache-${{ github.run_id }}

      - name: 上传报告
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: daily-report
          path: |
            report.md
            report.html
            cache/*.json
