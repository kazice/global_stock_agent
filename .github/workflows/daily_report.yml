name: 全球龙头行情日报

on:
  # ── 定时推送 ──
  schedule:
    - cron: '30 0 * * 1-5'    # 北京时间 8:30 (UTC 0:30) — 采集+推送
    - cron: '0 5 * * 1-5'     # 北京时间 13:00 (UTC 5:00) — 仅推送缓存

  # ── 手动触发 (GitHub 网页/App 点 Run workflow) ──
  workflow_dispatch:
    inputs:
      push_only:
        description: '只推送不采集（使用已有缓存）'
        type: boolean
        default: false

jobs:
  report:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖 (含 akshare)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 创建缓存目录
        run: mkdir -p cache

      - name: 恢复缓存
        uses: actions/cache/restore@v4
        with:
          path: cache/
          key: stock-cache-${{ github.run_id }}
          restore-keys: |
            stock-cache-

      - name: 运行行情采集与推送
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          JQUANTS_MAIL: ${{ secrets.JQUANTS_MAIL }}
          JQUANTS_PASS: ${{ secrets.JQUANTS_PASS }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          STOOQ_API_KEY: ${{ secrets.STOOQ_API_KEY }}
          REQUEST_INTERVAL: ${{ vars.REQUEST_INTERVAL || '0.35' }}
          REPORT_FORMAT: markdown
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && [ "${{ github.event.schedule }}" = "0 5 * * 1-5" ]; then
            # 13:00 定时: 只用缓存推送, 不重新采集
            python main.py --push-only
          elif [ "${{ github.event.inputs.push_only }}" = "true" ]; then
            # 手动触发选了 push_only
            python main.py --push-only
          else
            # 8:30 定时 / 手动触发默认: 完整采集+推送
            python main.py
          fi

      - name: 保存当天缓存
        uses: actions/cache/save@v4
        if: always()
        with:
          path: cache/
          key: stock-cache-${{ github.run_id }}

      - name: 上传报告
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: daily-report
          path: |
            report.md
            report.txt
            cache/*.json
